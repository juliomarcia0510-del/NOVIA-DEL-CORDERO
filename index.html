<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Novia del Cordero - App Oficial</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --oro: #C5A059;
            --fondo: #fcfbf7;
            --blanco: #ffffff;
            --purpura: #6a1b9a;
            --verde: #2ecc71;
            --azul: #3498db;
            --naranja: #e67e22;
            --rosa: #e84393;
            --rojo: #e74c3c;
        }

        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--fondo); color: #333; padding-bottom: 80px; overflow-x: hidden; }

        /* PORTADA CIELO CRISTALIZADO */
        .header-diamond {
            background: linear-gradient(rgba(255,255,255,0.1), rgba(255,255,255,0.3)), 
                        url('https://images.unsplash.com/photo-1515462277126-2dd0c162007a?q=80&w=1588&auto=format&fit=crop'); 
            background-size: cover; background-position: center; height: 220px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-bottom: 3px solid var(--oro); border-radius: 0 0 50px 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center;
        }
        .header-diamond h1 { font-family: 'Playfair Display', serif; color: var(--oro); font-size: 28px; text-transform: uppercase; margin: 0; text-shadow: 0 2px 10px rgba(255,255,255,0.8); }

        /* NAVEGACIÓN */
        .page { display: none; padding: 20px; max-width: 500px; margin: auto; }
        .page.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* TARJETAS PROFESIONALES */
        .section-title { font-family: 'Playfair Display', serif; color: var(--oro); text-align: center; margin: 30px 0 15px; font-size: 20px; letter-spacing: 1px; }
        .card { background: var(--blanco); border-radius: 20px; margin-bottom: 12px; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.03); overflow: hidden; transition: 0.3s; }
        .card-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 600; }
        .card-header span { display: flex; align-items: center; gap: 15px; }
        .card-header i.arrow { font-size: 12px; color: #ccc; transition: 0.3s; }
        .card-body { max-height: 0; overflow: hidden; transition: 0.4s ease-out; background: #fafafa; }
        .inner { padding: 20px; border-top: 1px solid #f0f0f0; line-height: 1.6; }

        /* BOTONES */
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; border: none; width: 100%; margin-top: 15px; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-ws { background: var(--verde); color: white; }
        .btn-claro { background: white; border: 1px solid #ddd; color: #555; }
