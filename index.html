<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorteo Biblia - La Novia del Cordero</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');

        :root { --oro: #D4AF37; --vino: #5D0E0E; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; font-family: 'Poppins', sans-serif; background-color: #fdfcf9;
            background-image: url('https://www.transparenttextures.com/patterns/cream-pixels.png');
            overflow-x: hidden;
        }

        .master-container { display: flex; width: 200vw; transition: transform 0.5s ease; }
        .page { width: 100vw; min-height: 100vh; padding-bottom: 100px; }

        .header { background: white; padding: 50px 20px; text-align: center; border-bottom: 3px solid var(--oro); }
        .header h1 { font-family: 'Playfair Display', serif; color: var(--vino); font-size: 28px; margin: 0; }

        /* GRID CULTOS */
        .grid-cultos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .c-box { padding: 15px; border-radius: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); background: white; }
        .c-box h4 { margin: 0 0 5px; font-size: 14px; color: var(--vino); }
        .info-p { font-size: 10px; margin: 3px 0; display: flex; align-items: center; gap: 6px; }

        /* SLIDER DINÁMICO MEJORADO */
        .section-t { text-align: center; font-family: 'Playfair Display'; color: var(--vino); margin: 30px 0 10px; }
        .card-slider { 
            background: white; margin: 0 20px; border-radius: 30px; overflow: hidden; 
            border: 1px solid #eee; box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            position: relative; height: 350px;
        }
        .track { 
            display: flex; height: 100%; width: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .track img { width: 100%; height: 100%; object-fit: contain; flex-shrink: 0; padding: 20px; }

        .price-tag {
            position: absolute; top: 15px; right: 15px; background: var(--oro); color: white;
            padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; z-index: 10;
        }

        .btn-wa { 
            display: block; width: 85%; margin: 20px auto; padding: 16px; background: #25D366; 
            color: white; text-align: center; border-radius: 18px; text-decoration: none; font-weight: 600;
        }

        /* VISOR FULLSCREEN MEJORADO */
        #fs-visor { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); 
            z-index: 10000; flex-direction: column; justify-content: center; align-items: center; 
        }
        #fs-track { display: flex; width: 100%; transition: transform 0.4s ease-out; }
        #fs-track img { width: 100vw; max-height: 80vh; object-fit: contain; flex-shrink: 0; }
        
        .close-btn { position: absolute; top: 30px; right: 30px; color: white; font-size: 40px; border: none; background: none; z-index: 11000; }

        .nav-dots { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: white; padding: 10px 25px; border-radius: 30px; display: flex; gap: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .dot { font-size: 20px; color: #ddd; }
        .dot.active { color: var(--oro); }
    </style>
</head>
<body>

<div class="master-container" id="master">
    <div class="page">
        <div class="header">
            <h1>La Novia del Cordero</h1>
            <p>❤️Cofradía,Cortes</p>
        </div>

        <div class="grid-cultos">
            <div class="c-box"><h4>Martes</h4><p class="info-p"><i class="fas fa-pray"></i> Oración</p></div>
            <div class="c-box"><h4>Jueves</h4><p class="info-p"><i class="fas fa-female"></i> Damas</p></div>
            <div class="c-box"><h4>Viernes</h4><p class="info-p"><i class="fas fa-book"></i> Crecimiento</p></div>
            <div class="c-box"><h4>Sábado</h4><p class="info-p"><i class="fas fa-fire"></i> Jóvenes</p></div>
            <div class="c-box" style="grid-column: span 2; text-align: center;"><h4>Domingo</h4><p class="info-p" style="justify-content:center"><i class="fas fa-church"></i> 9:00 AM | 6:30 PM</p></div>
        </div>

        <h3 class="section-t">🎟️ Sorteo Especial de Biblia</h3>
        <div class="card-slider" id="slider-trigger">
            <div class="price-tag">L. 40.00</div>
            <div class="track" id="track-biblia">
                </div>
        </div>
        
        <a href="https://wa.me/50433221100" class="btn-wa"><i class="fab fa-whatsapp"></i> Comprar vía WhatsApp</a>
    </div>

    <div class="page" style="background:rgba(255,255,255,0.7)">
        <h2 class="section-t" style="margin-top:70px">🛡️ Fortalecimiento</h2>
        <div style="padding:20px">
            <div style="background:white; padding:15px; border-radius:15px; border-left:5px solid var(--oro);">
                <h4>Devocionales</h4><p style="font-size:12px">6:00 AM Palabra de Dios diaria.</p>
            </div>
        </div>
    </div>
</div>

<div class="nav-dots">
    <div class="dot active" onclick="movePage(0)"><i class="fas fa-home"></i></div>
    <div class="dot" onclick="movePage(1)"><i class="fas fa-shield-alt"></i></div>
</div>

<div id="fs-visor">
    <button class="close-btn" onclick="closeV()">&times;</button>
    <div id="fs-track"></div>
</div>

<script>
    const SHEET_ID = '1-mAee7Xp8Oen786WSXyLaR9Mc7tgBLI_XWdJNp9vGV4';
    const URL_JSON = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    let bibleImages = [];
    let currentFSIndex = 0;

    async function fetchData() {
        try {
            const res = await fetch(URL_JSON);
            const text = await res.text();
            const json = JSON.parse(text.substring(47, text.length - 2));
            const rows = json.table.rows;
            
            const track = document.getElementById('track-biblia');
            const fsTrack = document.getElementById('fs-track');
            
            bibleImages = [];
            let htmlMain = "";
            let htmlFS = "";

            rows.forEach((r, index) => {
                if(r.c[0] && r.c[0].v) {
                    const url = r.c[0].v;
                    const desc = (r.c[1] && r.c[1].v) ? r.c[1].v.toLowerCase() : "";
                    
                    // LÓGICA DE FILTRO: Si dice Biblia O si está vacío (para agarrar todas tus filas de la Columna A)
                    if (desc.includes("biblia") || desc === "" || index > 0) {
                        bibleImages.push(url);
                        htmlMain += `<img src="${url}" onclick="openV(${bibleImages.length - 1})">`;
                        htmlFS += `<img src="${url}">`;
                    }
                }
            });

            track.innerHTML = htmlMain;
            fsTrack.innerHTML = htmlFS;
            
            if(bibleImages.length > 1) startAutoSlider(track, bibleImages.length);
            
        } catch(e) { 
            document.getElementById('track-biblia').innerHTML = "<p style='text-align:center; padding:50px;'>Error al conectar con Google Sheets</p>";
        }
    }

    // Movimiento Automático (Slider Principal)
    function startAutoSlider(el, total) {
        let i = 0;
        setInterval(() => {
            i = (i + 1) % total;
            el.style.transform = `translateX(-${i * 100}%)`;
        }, 4000);
    }

    // Visor Fullscreen
    function openV(idx) {
        currentFSIndex = idx;
        document.getElementById('fs-visor').style.display = 'flex';
        updateFS();
    }

    function updateFS() {
        document.getElementById('fs-track').style.transform = `translateX(-${currentFSIndex * 100}vw)`;
    }

    function closeV() { document.getElementById('fs-visor').style.display = 'none'; }

    // Swipe para Visor y Páginas
    let startX = 0;
    document.addEventListener('touchstart', e => startX = e.touches[0].clientX);
    document.addEventListener('touchend', e => {
        let diff = startX - e.changedTouches[0].clientX;
        if(Math.abs(diff) < 50) return;

        if(document.getElementById('fs-visor').style.display === 'flex') {
            if(diff > 0 && currentFSIndex < bibleImages.length - 1) currentFSIndex++;
            else if(diff < 0 && currentFSIndex > 0) currentFSIndex--;
            updateFS();
        } else {
            if(diff > 0) movePage(1); else movePage(0);
        }
    });

    function movePage(idx) {
        document.getElementById('master').style.transform = `translateX(-${idx * 100}vw)`;
        document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    window.onload = fetchData;
</script>
</body>
</html>
