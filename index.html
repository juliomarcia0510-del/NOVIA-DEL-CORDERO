<div id="segmento-sorteo" style="max-width: 450px; margin: 20px auto; font-family: 'Poppins', sans-serif;">
    
    <h3 style="text-align: center; color: #D4AF37; font-family: 'Playfair Display', serif; margin-bottom: 15px;">
        🎟️ Sorteo Especial de Biblia
    </h3>

    <div style="position: relative; background: #fff; border-radius: 25px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #f0f0f0;">
        
        <div id="engine-biblia" style="display: flex; transition: transform 0.7s cubic-bezier(0.45, 0, 0.55, 1); height: 320px; cursor: pointer;">
            <img src="https://m.media-amazon.com/images/I/919Nnre1ZXL.jpg" style="width: 100%; height: 100%; object-fit: contain; flex-shrink: 0; padding: 15px;">
        </div>

        <div id="status-biblia" style="position: absolute; bottom: 10px; right: 15px; background: rgba(0,0,0,0.5); color: white; font-size: 9px; padding: 3px 8px; border-radius: 10px; opacity: 0.7;">
            Cargando imágenes...
        </div>
    </div>

    <div style="text-align: center; margin-top: 15px;">
        <p style="font-size: 13px; color: #5D0E0E; margin-bottom: 10px; font-weight: 600;">
            Biblia Arcoíris - Cuero Café <br>
            <span style="color: #D4AF37;">L. 20.00 por boleto</span>
        </p>
        <a href="https://wa.me/50433221100?text=Hola César, deseo comprar boletos para el sorteo de la Biblia" 
           style="display: block; background: #25D366; color: white; text-decoration: none; padding: 12px; border-radius: 15px; font-weight: bold; font-size: 14px; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);">
           <i class="fab fa-whatsapp"></i> Comprar Boletos vía WhatsApp
        </a>
    </div>
</div>

<script>
    // Configuración Directa César
    const SHEET_ID_SORTEO = '1-mAee7Xp8Oen786WSXyLaR9Mc7tgBLI_XWdJNp9vGV4';
    const URL_SORTEO = `https://docs.google.com/spreadsheets/d/${SHEET_ID_SORTEO}/gviz/tq?tqx=out:json`;

    async function initSorteoSlider() {
        const engine = document.getElementById('engine-biblia');
        const status = document.getElementById('status-biblia');
        
        try {
            const response = await fetch(URL_SORTEO);
            const text = await response.text();
            // Limpiamos el JSON que manda Google
            const json = JSON.parse(text.substr(47).slice(0, -2));
            const rows = json.table.rows;
            
            // Filtramos solo las que dicen "Biblia" en la columna B (r.c[1])
            const imagenesValidas = rows.filter(r => 
                r.c[0] && r.c[0].v && 
                r.c[1] && r.c[1].v.toLowerCase().includes('biblia')
            );

            if (imagenesValidas.length > 0) {
                engine.innerHTML = ''; // Limpiamos la imagen de carga
                
                imagenesValidas.forEach((r, index) => {
                    const img = document.createElement('img');
                    img.src = r.c[0].v; // Columna A
                    img.style.cssText = "width: 100%; height: 100%; object-fit: contain; flex-shrink: 0; padding: 15px;";
                    img.onerror = () => img.remove(); // Si el link está roto, se elimina la imagen para no trabar el slider
                    engine.appendChild(img);
                });
                
                status.innerText = `${imagenesValidas.length} Fotos disponibles`;
                startAutoCycle(engine, imagenesValidas.length);
            } else {
                status.innerText = "Usando imágenes locales";
                startAutoCycle(engine, 1);
            }
        } catch (error) {
            console.error("Error cargando sorteo:", error);
            status.innerText = "Error de conexión";
            startAutoCycle(engine, 1);
        }
    }

    function startAutoCycle(track, count) {
        if (count <= 1) return;
        
        let currentIndex = 0;
        let isPaused = false;

        // Ciclo automático
        const interval = setInterval(() => {
            if (!isPaused) {
                currentIndex = (currentIndex + 1) % count;
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
            }
        }, 4000); // Cambia cada 4 segundos

        // Pausar al tocar (para ver detalles)
        track.addEventListener('touchstart', () => isPaused = true);
        track.addEventListener('mousedown', () => isPaused = true);
        
        // Reanudar después de 8 segundos de inactividad
        track.addEventListener('touchend', () => setTimeout(() => isPaused = false, 8000));
        track.addEventListener('mouseup', () => setTimeout(() => isPaused = false, 8000));
    }

    // Ejecutar al cargar
    initSorteoSlider();
</script>
