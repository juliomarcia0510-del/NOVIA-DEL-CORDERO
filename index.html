<div id="segmento-sorteo" style="background-color: #f4f4f4; padding: 30px 15px; border-radius: 30px; max-width: 480px; margin: 20px auto; font-family: 'Poppins', sans-serif;">
    
    <div style="text-align: center; margin-bottom: 20px;">
        <span style="background: #D4AF37; color: white; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; letter-spacing: 1px;">PREMIUM</span>
        <h3 style="color: #333; font-family: 'Playfair Display', serif; font-size: 24px; margin: 10px 0 5px;">Rifa de Biblia Arcoiris</h3>
        <p style="color: #888; font-size: 12px; margin: 0;">L. 20.00 por boleto. ¡Toca la foto para ampliarla!</p>
    </div>

    <div style="position: relative; background: #ffffff; border-radius: 25px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.08); border: 1px solid #e0e0e0;">
        
        <div id="engine-biblia" style="display: flex; transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1); height: 380px; cursor: zoom-in;">
            <div style="width: 100%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #fff;">
                <div style="text-align: center;">
                    <i class="fas fa-spinner fa-spin" style="color: #D4AF37; font-size: 24px;"></i>
                    <p style="font-size: 11px; color: #aaa; margin-top: 10px;">Sincronizando galería...</p>
                </div>
            </div>
        </div>

        <div id="status-dots" style="position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px;"></div>
    </div>

    <div style="text-align: center; margin-top: 25px;">
        <a href="https://wa.me/50433221100?text=Hola César, quiero participar en la rifa de la Biblia" 
           style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: #25D366; color: white; text-decoration: none; padding: 15px 35px; border-radius: 50px; font-weight: 600; font-size: 15px; box-shadow: 0 8px 20px rgba(37, 211, 102, 0.25); transition: 0.3s;">
           <i class="fab fa-whatsapp"></i> Comprar Boleto L.20
        </a>
    </div>

    <div id="full-view" style="display: none; position: fixed; inset: 0; background: rgba(18, 18, 18, 0.98); z-index: 10000; flex-direction: column; align-items: center; justify-content: center;" onclick="closeImg()">
        <button style="position: absolute; top: 30px; right: 30px; background: none; border: none; color: white; font-size: 35px;">&times;</button>
        <img id="img-target" src="" style="max-width: 90%; max-height: 80%; object-fit: contain; border-radius: 8px;">
        <p style="color: #D4AF37; margin-top: 20px; font-size: 13px; letter-spacing: 1px;">TOQUE PARA CERRAR</p>
    </div>
</div>

<script>
    const SHEET_ID = '1-mAee7Xp8Oen786WSXyLaR9Mc7tgBLI_XWdJNp9vGV4';
    // Cambiamos la técnica de lectura para evitar el error de conexión
    const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    async function loadGallery() {
        const engine = document.getElementById('engine-biblia');
        const dots = document.getElementById('status-dots');
        
        try {
            const resp = await fetch(DATA_URL);
            const text = await resp.text();
            const json = JSON.parse(text.substring(47, text.length - 2));
            const rows = json.table.rows;
            
            // FILTRO INTELIGENTE: Si la Columna B está vacía o dice Biblia, la aceptamos
            const images = rows.filter(r => 
                r.c[0] && r.c[0].v && 
                (!r.c[1] || !r.c[1].v || r.c[1].v.toLowerCase().includes('biblia'))
            ).map(r => r.c[0].v);

            if (images.length > 0) {
                engine.innerHTML = '';
                dots.innerHTML = '';
                
                images.forEach((url, i) => {
                    const img = document.createElement('img');
                    img.src = url;
                    img.style.cssText = "width: 100%; height: 100%; object-fit: contain; flex-shrink: 0; padding: 20px;";
                    img.onclick = () => {
                        document.getElementById('img-target').src = url;
                        document.getElementById('full-view').style.display = 'flex';
                    };
                    engine.appendChild(img);

                    const dot = document.createElement('div');
                    dot.style.cssText = "width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.1); transition: 0.3s;";
                    dot.id = `dot-${i}`;
                    dots.appendChild(dot);
                });

                startLoop(engine, images.length);
            }
        } catch (err) {
            engine.innerHTML = '<p style="padding:40px; color:#e74c3c; font-size:12px; text-align:center;">Error de sincronización.<br>Verifica la privacidad del Sheet.</p>';
        }
    }

    function startLoop(track, total) {
        let i = 0;
        const updateDots = (idx) => {
            for(let d=0; d<total; d++) {
                document.getElementById(`dot-${d}`).style.background = (d === idx) ? '#D4AF37' : 'rgba(0,0,0,0.1)';
                document.getElementById(`dot-${d}`).style.transform = (d === idx) ? 'scale(1.5)' : 'scale(1)';
            }
        };

        updateDots(0);
        setInterval(() => {
            i = (i + 1) % total;
            track.style.transform = `translateX(-${i * 100}%)`;
            updateDots(i);
        }, 4000);
    }

    function closeImg() {
        document.getElementById('full-view').style.display = 'none';
    }

    loadGallery();
</script>
